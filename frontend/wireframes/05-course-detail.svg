nsae subtilitatis, obscuris et molesuada fames.</text><text x="323.39" y="416.33" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="12.41" font-weight="normal" font-style="normal" text-anchor="start" fill="#333">Morbi odio eros, volutpat ut pharetra vitae, lobortis sed nibh.</text><text x="323.39" y="437.69" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="12.41" font-weight="normal" font-style="normal" text-anchor="start" fill="#333">Tu quaque, brute, fili mi, nihil timor populi, nihil.</text><text x="323.39" y="459.05" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="12.41" font-weight="normal" font-style="normal" text-anchor="start" fill="#333">Pellentesque habitant morbi tristique senectus et netus et</text><text x="323.39" y="480.4" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="12.41" font-weight="normal" font-style="normal" text-anchor="start" fill="#333">malesuada fames ac turpis egestas. Vestibulum tortor quam.</text><text x="323.39" y="501.76" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="12.41" font-weight="normal" font-style="normal" text-anchor="start" fill="#333">Feugiat vitae, ultricies eget, tempor sit amet, ante.</text><text x="323.39" y="523.11" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="12.41" font-weight="normal" font-style="normal" text-anchor="start" fill="#333">Donec eu libero sit amet quam egestas semper.</text><rect x="1090.17" y="337.63" width="325.42" height="170.85" rx="10.17" fill="#e6e6e6"/><text x="1114.58" y="371.15" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="14.03" font-weight="bold" font-style="normal" text-anchor="start" fill="#1e1e1e">Enrol in this course</text><text x="1114.58" y="392.42" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="10.98" font-weight="normal" font-style="normal" text-anchor="start" fill="#6b6b6b">You are not enrolled yet.</text><rect x="1114.58" y="414.92" width="276.61" height="34.58" rx="6.1" fill="#3d3b3b" stroke="#3d3b3b" stroke-width="1.63"/><text x="1252.88" y="437.37" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="13.22" font-weight="bold" font-style="normal" text-anchor="middle" fill="white">Enrol now</text><text x="1114.58" y="481.78" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="10.58" font-weight="normal" font-style="normal" text-anchor="start" fill="#6b6b6b">Students can leave at any time.</text><rect x="1090.17" y="536.95" width="325.42" height="126.1" rx="10.17" fill="none" stroke="#808080" stroke-width="1.83" stroke-dasharray="6.1 4.07"/><text x="1114.58" y="565.31" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="10.98" font-weight="normal" font-style="italic" text-anchor="start" fill="#6b6b6b">Teacher (owner) &amp; Admin only</text><rect x="1114.58" y="581.69" width="126.1" height="30.51" rx="6.1" fill="white" stroke="#3d3b3b" stroke-width="1.63"/><text x="1177.63" y="601.75" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="12.2" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1e1e1e">Edit</text><rect x="1252.88" y="581.69" width="138.31" height="30.51" rx="6.1" fill="white" stroke="#3d3b3b" stroke-width="1.63"/><text x="1322.03" y="601.75" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="12.2" font-weight="normal" font-style="normal" text-anchor="middle" fill="#1e1e1e">Delete</text><text x="1114.58" y="642.45" font-family="'Century Gothic', 'TeX Gyre Adventor', sans-serif" font-size="10.58" font-weight="normal" font-style="normal" text-anchor="start" fill="#6b6b6b">Delete asks for confirmation first.</text></svg>